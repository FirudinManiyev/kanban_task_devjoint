<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board - Firudin</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <h1>Kanban İdarəetmə</h1>
    </header>

    <main class="board">

        <section class="column">
            <div class="column-header">
                <h2>Gözləmədə</h2>
            </div>

            <div id="todo"></div>
        </section>

        <section class="column">
            <div class="column-header">
                <h2>İcra olunur</h2>
            </div>

            <div id="doing"></div>
        </section>

        <section class="column">
            <div class="column-header">
                <h2>Tamamlandı</h2>
            </div>

            <div id="done"></div>
        </section>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
