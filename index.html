<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board - Firudin</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <h1>Kanban İdarəetmə</h1>
    </header>

    <section class="task-form">
        <input type="text" id="taskTitle" placeholder="Tapşırıq başlığı">

        <textarea id="taskDescription" placeholder="Tapşırıq təsviri"></textarea>

        <select id="taskStatus">
            <option value="todo">Gözləmədə</option>
            <option value="doing">İcra olunur</option>
            <option value="done">Tamamlandı</option>
        </select>

        <select id="taskPriority">
            <option value="high">Yüksək</option>
            <option value="medium">Orta</option>
            <option value="low">Aşağı</option>
        </select>

        <button id="addTaskBtn">
            Tapşırıq əlavə et
        </button>
    </section>

    <section class="filters">

        <input type="text" id="searchInput" placeholder="Tapşırıq axtar...">

        <select id="priorityFilter">
            <option value="all">Bütün prioritetlər</option>
            <option value="high">Yüksək</option>
            <option value="medium">Orta</option>
            <option value="low">Aşağı</option>
        </select>

    </section>

    <main class="board">

        <section class="column">
            <div class="column-header">
                <h2>📋 Gözləmədə</h2>
            </div>

            <div id="todo" class="task-list"></div>
        </section>

        <section class="column">
            <div class="column-header">
                <h2>⚡ İcra olunur</h2>
            </div>

            <div id="doing" class="task-list"></div>
        </section>

        <section class="column">
            <div class="column-header">
                <h2>✅ Tamamlandı</h2>
            </div>

            <div id="done" class="task-list"></div>
        </section>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
